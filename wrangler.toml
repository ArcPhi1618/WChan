name = "wonderland-archives"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "journal_db"
database_id = "YOUR_D1_DATABASE_ID_HERE" # Replace with the database ID from `npx wrangler d1 create journal_db`
